[pytest]
# ISR's own tests live under tests/, experiments/, securities/ — but sibling
# repos are materialized into the workspace by CI (workspace contract), and
# pytest would otherwise collect THEIR tests too (e.g. aie/tests needs grpc,
# opentelemetry which are not ISR deps). Keep collection scoped to ISR.
testpaths = tests experiments security
norecursedirs = aie trust-gateway works-execution work-intelligence-v2 after-graph-governance .git