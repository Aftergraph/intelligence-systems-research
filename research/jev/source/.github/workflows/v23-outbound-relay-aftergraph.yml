name: v2.3 outbound relay fabric (Aftergraph runner)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relay-fabric:
    runs-on: [self-hosted, linux, x64, aftergraph-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install package + test dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e '.[dev]'
      - name: v2.3 focused tests
        run: python3 -m pytest -q tests/test_v23_*.py
      - name: Outbound-only relay vertical
        run: jev-one v23-demo
      - name: Secret scan
        run: python3 scripts/verify_no_secrets.py .
