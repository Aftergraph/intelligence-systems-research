name: Live provider smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-smoke:
    name: TypeSafe + Dialagram authenticated smoke
    runs-on: ubuntu-latest
    environment: provider-smoke
    timeout-minutes: 10
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      DIALAGRAM_API_KEY: ${{ secrets.DIALAGRAM_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install .
      - name: Secret presence only
        run: jev-one secret-status
      - name: Authenticated provider smoke
        run: jev-one live-smoke
