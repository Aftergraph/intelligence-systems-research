name: v2.8 paired holdout verification

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: [self-hosted, linux, x64, aftergraph]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_v28_*.py tests/test_v27_*.py tests/test_v26_*.py tests/test_v25_*.py
      - run: python -m compileall -q src tests
