name: v1.8 networked kernel (Aftergraph runner)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  networked-kernel:
    runs-on: [self-hosted, linux, x64, aftergraph-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install package
        run: python3 -m pip install .
      - name: v1.8 focused tests
        run: python3 -m pytest -q tests/test_v18_*.py
      - name: Offline identity/lease/proof vertical
        run: jev-one networked-demo
      - name: Secret scan
        run: python3 scripts/verify_no_secrets.py .
