decision:
  backend: openai_compatible
  api_key_env: DIALAGRAM_API_KEY
  base_url: https://dialagram.me/router/v1
  model: qwen-3.8-max-thinking

shadow_decision:
  enabled: true
  backend: jev
  api_key_env: TYPESAFE_API_KEY
  base_url: https://api.typesafe.ai
  model: jev-latest
  incumbent_strategy: qwen-frontier-control
  candidate_strategy: jev-system-one-control

runtime:
  verify_command: "python -m pytest -q"
  max_turns: 24
  scope_top_k: 8
  command_mode: verify_only
  retention_every: 6
  loop_check_every: 4

intelligence_fabric:
  enabled: true
  promotion_registry_path: ../state/promoted-routes.json
  competence_graph_path: ../state/competence.json
  frontier_budget:
    input_tokens: 120000
    output_tokens: 25000
  required_vsr:
    generation: 0.90
  strategies:
    - id: qwen-3.8-max-thinking
      source: frontier
      capabilities: [generation]
      predicted_vsr: 0.95
      estimated_cost_usd: 0.0
      estimated_latency_ms: 30000
      frontier_input_tokens: 20000
      frontier_output_tokens: 5000
      model_alias: dialagram-qwen-3.8-max-thinking
      metadata:
        prior_source: illustrative-until-live-benchmark

models:
  dialagram-qwen-3.8-max-thinking:
    provider: dialagram
    model: qwen-3.8-max-thinking
    tier: frontier
    transport: openai_compatible
    base_url: https://dialagram.me/router/v1
    api_key_env: DIALAGRAM_API_KEY
    context_window: 500000
    supports_tools: true
