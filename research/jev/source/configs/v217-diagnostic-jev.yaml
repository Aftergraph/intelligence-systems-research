decision:
  backend: typesafe
  api_key_env: TYPESAFE_API_KEY
  base_url: https://api.typesafe.ai
  model: jev-latest
  offline_fallback: false
runtime:
  verify_command: python -m pytest -q
  max_turns: 6
  scope_top_k: 8
  command_mode: verify_only
  retention_every: 2
  loop_check_every: 2
  policy:
    destructive_block_threshold: 0.85
    human_threshold: 0.7
    repo_local_write_auto_allow: true
    authoritative_verifier: true
models:
  qwen-3.8-max-thinking:
    provider: dialagram
    model: qwen-3.8-max-thinking
    tier: frontier
    transport: openai_compatible
    base_url: https://dialagram.me/router/v1
    api_key_env: DIALAGRAM_API_KEY