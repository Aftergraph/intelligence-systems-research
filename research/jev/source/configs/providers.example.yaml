# Provider transport patterns. The registry is data-driven rather than a closed enum.
# IMPORTANT: discovered/imported models are unclassified by default. Coding
# eligibility requires an explicit tier: frontier (or frontier_models allowlist).
models:
  # Verified against OpenAI's current model docs at the 2026-09-24 evidence cut.
  openai-sol-native:
    provider: openai
    model: gpt-5.6-sol
    tier: frontier
    transport: openai_responses
    api_key_env: OPENAI_API_KEY
    context_window: 1050000
    reasoning_effort: high

  # Current Anthropic families at this evidence cut. Keep frontier classification
  # operator-controlled if your own evals prefer a different tier.
  anthropic-fable-native:
    provider: anthropic
    model: claude-fable-5
    tier: unclassified
    transport: anthropic_messages
    api_key_env: ANTHROPIC_API_KEY

  anthropic-opus-native:
    provider: anthropic
    model: claude-opus-5
    tier: unclassified
    transport: anthropic_messages
    api_key_env: ANTHROPIC_API_KEY

  # Google documents Gemini 3.8 Flash as stable and intended for long-horizon SWE/agents.
  google-gemini-native:
    provider: google
    model: gemini-3.8-flash
    tier: unclassified
    transport: google_generate_content
    api_key_env: GOOGLE_API_KEY


  dialagram-qwen-3.8-max-thinking:
    provider: dialagram
    model: qwen-3.8-max-thinking
    tier: frontier
    transport: openai_compatible
    base_url: https://dialagram.me/router/v1
    api_key_env: DIALAGRAM_API_KEY

  openrouter-compatible:
    provider: openrouter
    model: replace-with-current-model-id
    tier: unclassified
    transport: openai_compatible
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY

  mistral-compatible:
    provider: mistral
    model: replace-with-current-model-id
    tier: unclassified
    transport: openai_compatible
    base_url: https://api.mistral.ai/v1
    api_key_env: MISTRAL_API_KEY

  deepseek-compatible:
    provider: deepseek
    model: replace-with-current-model-id
    tier: unclassified
    transport: openai_compatible
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY

  xai-compatible:
    provider: xai
    model: replace-with-current-model-id
    tier: unclassified
    transport: openai_compatible
    base_url: https://api.x.ai/v1
    api_key_env: XAI_API_KEY

  groq-compatible:
    provider: groq
    model: replace-with-current-model-id
    tier: unclassified
    transport: openai_compatible
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY

  together-compatible:
    provider: together
    model: replace-with-current-model-id
    tier: unclassified
    transport: openai_compatible
    base_url: https://api.together.xyz/v1
    api_key_env: TOGETHER_API_KEY

  fireworks-compatible:
    provider: fireworks
    model: replace-with-current-model-id
    tier: unclassified
    transport: openai_compatible
    base_url: https://api.fireworks.ai/inference/v1
    api_key_env: FIREWORKS_API_KEY

  cerebras-compatible:
    provider: cerebras
    model: replace-with-current-model-id
    tier: unclassified
    transport: openai_compatible
    base_url: https://api.cerebras.ai/v1
    api_key_env: CEREBRAS_API_KEY

  perplexity-compatible:
    provider: perplexity
    model: replace-with-current-model-id
    tier: unclassified
    transport: openai_compatible
    base_url: https://api.perplexity.ai
    api_key_env: PERPLEXITY_API_KEY

  ollama-local:
    provider: ollama
    model: replace-with-local-model-id
    tier: unclassified
    transport: openai_compatible
    base_url: http://localhost:11434/v1

  vllm-local:
    provider: vllm
    model: replace-with-local-model-id
    tier: unclassified
    transport: openai_compatible
    base_url: http://localhost:8000/v1

  arbitrary-openai-compatible:
    provider: custom
    model: provider/model-id
    tier: unclassified
    transport: openai_compatible
    base_url: https://gateway.example/v1
    api_key_env: GATEWAY_API_KEY

  # Dynamic path for any provider/model supported by the installed LiteLLM release.
  litellm-any-provider:
    provider: litellm
    model: provider/model-id
    tier: unclassified
    transport: litellm
