# Hermes-oriented production profile: TypeSafe Jev owns the low-cost typed
# decision plane; Dialagram/Nexum supplies generative coding models over its
# OpenAI-compatible endpoint. Model IDs reflect Dialagram's public catalog at
# the 2026-09-24 evidence cut. Only Qwen 3.8 Max variants are marked frontier
# because Dialagram explicitly describes that family as flagship/frontier-grade.
decision:
  backend: typesafe
  api_key_env: TYPESAFE_API_KEY
  base_url: https://api.typesafe.ai
  model: jev-latest
  offline_fallback: false

runtime:
  verify_command: "python -m pytest -q"
  max_turns: 24
  scope_top_k: 8
  command_mode: verify_only
  retention_every: 6
  loop_check_every: 4
  policy:
    destructive_block_threshold: 0.85
    human_threshold: 0.70

models:
  qwen-3.8-max-thinking:
    provider: dialagram
    model: qwen-3.8-max-thinking
    tier: frontier
    transport: openai_compatible
    base_url: https://dialagram.me/router/v1
    api_key_env: DIALAGRAM_API_KEY

  qwen-3.8-max:
    provider: dialagram
    model: qwen-3.8-max
    tier: frontier
    transport: openai_compatible
    base_url: https://dialagram.me/router/v1
    api_key_env: DIALAGRAM_API_KEY

