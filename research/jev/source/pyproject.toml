[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aftergraph-jev-engineering"
version = "2.11.1"
description = "Verified adaptive intelligence fabric with typed System-One control, frontier execution, signed evidence and mTLS node transport."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Aftergraph"}]
dependencies = [
  "httpx>=0.28,<1",
  "PyYAML>=6.0,<7",
  "typer>=0.16,<1",
  "rich>=13,<15",
  "cryptography>=46,<47",
]

[project.optional-dependencies]
all-providers = ["litellm>=1.102.0,<2"]
dev = ["pytest>=9,<10", "pytest-cov>=7,<8", "ruff>=0.13,<1"]

[project.scripts]
jev-one = "jev_engineering.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"jev_engineering" = ["schemas/*.json"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
