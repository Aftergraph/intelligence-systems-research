version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule: {interval: "quarterly"}  # ponytail: study011 is closed/frozen — weekly bumps cost an amendment each with zero research value; security updates still open immediately
    open-pull-requests-limit: 5
    groups:
      # ponytail: study011's no-silent-change gate freezes the dependency
      # lock, so every individual bump forces an amendment + collides with
      # the next PR on the same file. One grouped PR per week = one
      # amendment instead of five. Ceiling: slower per-dep adoption;
      # upgrade path is removing the group if the gate is ever retired.
      pip-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: {interval: "weekly", day: "monday", time: "06:30", timezone: "Europe/Copenhagen"}
    open-pull-requests-limit: 5
    groups:
      github-actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
