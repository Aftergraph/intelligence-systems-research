name: STUDY-ECO-001 Preregistration Integrity

on:
  pull_request:
    paths:
      - "STUDY-ECO-001-PREREGISTRATION.md"
      - "data/study_eco_001_preregistration.json"
      - "experiments/economic_authority/study_eco_001.py"
      - "tests/test_study_eco_001.py"
      - ".github/workflows/study-eco-001-integrity.yml"
  push:
    branches: [main]
    paths:
      - "STUDY-ECO-001-PREREGISTRATION.md"
      - "data/study_eco_001_preregistration.json"
      - "experiments/economic_authority/study_eco_001.py"
      - "tests/test_study_eco_001.py"

permissions:
  contents: read

jobs:
  preregistration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Run frozen STUDY-ECO-001 analyzer tests
        run: python -m pytest -q tests/test_study_eco_001.py
