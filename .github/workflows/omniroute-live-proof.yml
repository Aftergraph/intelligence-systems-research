name: OmniRoute live proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/omniroute-live-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  omniroute-live-proof:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      OMNIROUTE_SERVER_HOST: 127.0.0.1
      REQUIRE_API_KEY: "false"
      APP_LOG_LEVEL: info

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Prepare isolated OmniRoute runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pkg = Join-Path $env:RUNNER_TEMP "omniroute-pkg"
          $data = Join-Path $env:RUNNER_TEMP "omniroute-data"
          $evidence = Join-Path $env:RUNNER_TEMP "omniroute-evidence"
          New-Item -ItemType Directory -Force -Path $pkg,$data,$evidence | Out-Null
          "PKG_DIR=$pkg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "DATA_DIR=$data" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "EVIDENCE_DIR=$evidence" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $endpointKey = "proof-" + [guid]::NewGuid().ToString("N")
          $adminPassword = "proof-" + [guid]::NewGuid().ToString("N")
          "OMNIROUTE_API_KEY=$endpointKey" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "OMNIROUTE_ADMIN_PASSWORD=$adminPassword" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $chromeRegistry = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths\chrome.exe"
          $chromePath = (Get-ItemProperty $chromeRegistry).'(default)'
          if (-not (Test-Path $chromePath)) { throw "Hosted Windows Chrome executable not found" }
          "CLOUDFLARE_PLAYGROUND_CHROME_PATH=$chromePath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $chromePath | Set-Content -Path (Join-Path $evidence "chrome-path.txt") -Encoding utf8
          node --version | Tee-Object -FilePath (Join-Path $evidence "node-version.txt")
          npm --version | Tee-Object -FilePath (Join-Path $evidence "npm-version.txt")
          npm view omniroute version | Tee-Object -FilePath (Join-Path $evidence "registry-version.txt")
          npm install --prefix $pkg omniroute@3.8.50 --no-audit --no-fund
          $cli = Join-Path $pkg "node_modules\.bin\omniroute.cmd"
          & $cli --version | Tee-Object -FilePath (Join-Path $evidence "omniroute-version.txt")
          "OMNIROUTE_CLI=$cli" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Record host identity
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $info = [ordered]@{
            hostname = $env:COMPUTERNAME
            os = [System.Environment]::OSVersion.VersionString
            architecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
            processArchitecture = [System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString()
            runnerName = $env:RUNNER_NAME
            runnerTemp = $env:RUNNER_TEMP
            sha = $env:GITHUB_SHA
          }
          $info | ConvertTo-Json | Set-Content -Path (Join-Path $env:EVIDENCE_DIR "host.json") -Encoding utf8
          Get-Content (Join-Path $env:EVIDENCE_DIR "host.json")

      - name: Initialize isolated config
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & $env:OMNIROUTE_CLI setup --non-interactive --password $env:OMNIROUTE_ADMIN_PASSWORD
          & $env:OMNIROUTE_CLI setup --non-interactive --add-provider --provider llm7 --provider-name "LLM7 live proof" --api-key $env:OMNIROUTE_API_KEY

      - name: Start gateway and prove inference path
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stdout = Join-Path $env:EVIDENCE_DIR "omniroute-stdout.log"
          $stderr = Join-Path $env:EVIDENCE_DIR "omniroute-stderr.log"
          $p = Start-Process -FilePath $env:OMNIROUTE_CLI -ArgumentList "--no-open" -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $p.Id | Set-Content -Path (Join-Path $env:EVIDENCE_DIR "pid.txt")

          $ready = $false
          for ($i = 0; $i -lt 300; $i++) {
            Start-Sleep -Seconds 1
            if ($p.HasExited) { break }
            try {
              $resp = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:20128/healthz" -TimeoutSec 2
              if ($resp.StatusCode -eq 200) { $ready = $true; break }
            } catch {}
          }
          if (-not $ready) {
            if (Test-Path $stdout) { Get-Content $stdout -Tail 200 }
            if (Test-Path $stderr) { Get-Content $stderr -Tail 200 }
            throw "OmniRoute did not become healthy on 127.0.0.1:20128/healthz"
          }

          $headers = @{ Authorization = "Bearer $env:OMNIROUTE_API_KEY" }
          $modelsRaw = Invoke-RestMethod -Uri "http://127.0.0.1:20128/v1/models" -Method Get -Headers $headers -TimeoutSec 120
          $modelsRaw | ConvertTo-Json -Depth 8 | Set-Content -Path (Join-Path $env:EVIDENCE_DIR "models.json") -Encoding utf8

          $candidates = @(
            "pollinations/openai-fast",
            "pollinations/deepseek",
            "pollinations/qwen-coder",
            "aihorde/google/gemma-4-31b",
            "opencode/big-pickle",
            "opencode/mimo-v2.5-free",
            "uncloseai/Lorbus/Qwen3.6-27B-int4-AutoRound"
          )

          $attempts = @()
          $summary = $null
          foreach ($model in $candidates) {
            $body = @{
              model = $model
              messages = @(@{ role = "user"; content = "Return exactly OMNIROUTE_PROOF_OK" })
              temperature = 0
              max_tokens = 32
            } | ConvertTo-Json -Depth 6

            $sw = [System.Diagnostics.Stopwatch]::StartNew()
            try {
              $chat = Invoke-RestMethod -Uri "http://127.0.0.1:20128/v1/chat/completions" -Method Post -Headers $headers -ContentType "application/json" -Body $body -TimeoutSec 180
              $sw.Stop()
              $attempts += [ordered]@{
                model = $model
                ok = $true
                latencyMs = $sw.ElapsedMilliseconds
              }
              Write-Host ("PROVIDER_ATTEMPT_OK {0} {1}ms" -f $model, $sw.ElapsedMilliseconds)
              $summary = [ordered]@{
                ok = $true
                requestedModel = $model
                returnedModel = $chat.model
                content = $chat.choices[0].message.content
                latencyMs = $sw.ElapsedMilliseconds
                usage = $chat.usage
                gateway = "http://127.0.0.1:20128/v1"
                proof = "direct-keyless-provider-sweep"
              }
              break
            } catch {
              $sw.Stop()
              $detail = $_.ErrorDetails.Message
              if (-not $detail) { $detail = $_.Exception.Message }
              $attempts += [ordered]@{
                model = $model
                ok = $false
                latencyMs = $sw.ElapsedMilliseconds
                error = $detail
              }
              $compact = ($detail -replace '[\r\n]+', ' ')
              if ($compact.Length -gt 700) { $compact = $compact.Substring(0, 700) }
              Write-Host ("PROVIDER_ATTEMPT_FAIL {0} {1}ms :: {2}" -f $model, $sw.ElapsedMilliseconds, $compact)
            }
          }

          $attempts | ConvertTo-Json -Depth 8 | Set-Content -Path (Join-Path $env:EVIDENCE_DIR "direct-provider-attempts.json") -Encoding utf8
          if (-not $summary) {
            $verdict = [ordered]@{
              gatewayHealthy = $true
              directInference = $false
              candidateCount = $candidates.Count
              classification = "external-free-provider-unavailable-on-runner"
              experimentCompleted = $true
            }
            $verdict | ConvertTo-Json -Depth 6 | Set-Content -Path (Join-Path $env:EVIDENCE_DIR "verdict.json") -Encoding utf8
            Get-Content (Join-Path $env:EVIDENCE_DIR "direct-provider-attempts.json")
            $verdict | ConvertTo-Json -Depth 6
          } else {
            $verdict = [ordered]@{
              gatewayHealthy = $true
              directInference = $true
              successfulModel = $summary.requestedModel
              classification = "end-to-end-keyless-inference-proven"
              experimentCompleted = $true
            }
            $verdict | ConvertTo-Json -Depth 6 | Set-Content -Path (Join-Path $env:EVIDENCE_DIR "verdict.json") -Encoding utf8
            $summary | ConvertTo-Json -Depth 8 | Set-Content -Path (Join-Path $env:EVIDENCE_DIR "inference-proof.json") -Encoding utf8
            $summary | ConvertTo-Json -Depth 8
          }

          # Secondary diagnostic only: exercise OmniRoute's auto route, but do not
          # make the direct keyless-provider proof depend on external catalog drift.
          try {
            $autoBody = @{
              model = "auto"
              messages = @(@{ role = "user"; content = "Return exactly OMNIROUTE_AUTO_OK" })
              temperature = 0
              max_tokens = 32
            } | ConvertTo-Json -Depth 6
            $auto = Invoke-RestMethod -Uri "http://127.0.0.1:20128/v1/chat/completions" -Method Post -Headers $headers -ContentType "application/json" -Body $autoBody -TimeoutSec 120
            [ordered]@{
              ok = $true
              returnedModel = $auto.model
              content = $auto.choices[0].message.content
              usage = $auto.usage
            } | ConvertTo-Json -Depth 8 | Set-Content -Path (Join-Path $env:EVIDENCE_DIR "auto-route-diagnostic.json") -Encoding utf8
          } catch {
            $_.ErrorDetails.Message | Set-Content -Path (Join-Path $env:EVIDENCE_DIR "auto-route-diagnostic-error.txt") -Encoding utf8
          }

      - name: Run OmniRoute doctor
        if: always()
        shell: pwsh
        run: |
          & $env:OMNIROUTE_CLI doctor 2>&1 |
            Tee-Object -FilePath (Join-Path $env:EVIDENCE_DIR "doctor.json")

      - name: Stop isolated gateway
        if: always()
        shell: pwsh
        run: |
          $pidFile = Join-Path $env:EVIDENCE_DIR "pid.txt"
          if (Test-Path $pidFile) {
            $procId = [int](Get-Content $pidFile)
            Stop-Process -Id $procId -Force -ErrorAction SilentlyContinue
          }

      - name: Upload live proof evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: omniroute-live-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/omniroute-evidence
          if-no-files-found: error
          retention-days: 14
