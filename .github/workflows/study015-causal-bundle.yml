name: STUDY-015 Causal Bundle

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-test.txt
      - name: Validate capability + causal receipt layers
        run: |
          python -m pytest -q tests/test_study015_probe_bundle.py tests/test_study015_causal_bundle.py
          python -m experiments.study015.causal_bundle > study015-causal-bundle.json
          python - <<'PY'
          import json
          p=json.load(open('study015-causal-bundle.json', encoding='utf-8'))
          assert p['schema']=='study015.causal-bundle/1.0'
          assert p['causal_root_sha256']=='30e2d91a343418c34c703333d1d5a3cb5e605e6c8c926e0d6c37d010a71c56f1'
          assert all(p['seams'].values())
          assert all(p['hostile'].values())
          assert p['live_performance_claim'] is False
          print('STUDY015_CAUSAL_BUNDLE=PASS')
          print('component_probe_root_sha256='+p['component_probe_root_sha256'])
          print('causal_root_sha256='+p['causal_root_sha256'])
          PY
