name: Aftergraph Codex NEXUM bootstrap

on:
  push:
    branches:
      - ops/codex-nexum-jonas-lenovo-20260921
    paths:
      - .github/workflows/codex-nexum-jonas-lenovo.yml

permissions:
  contents: write

concurrency:
  group: codex-nexum-jonas-lenovo
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: [self-hosted, Windows, X64, aftergraph-jar-exp-0013]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Probe and configure NEXUM for Codex Desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidencePath = Join-Path $env:GITHUB_WORKSPACE 'ops-evidence-codex-nexum.json'
          $e = [ordered]@{
            schema = 'aftergraph.codex-nexum-bootstrap.evidence.v1'
            timestamp_utc = [DateTime]::UtcNow.ToString('o')
            node = $env:COMPUTERNAME
            runner = $env:RUNNER_NAME
            runner_os = $env:RUNNER_OS
            target_profile_detected = $false
            codex_config_existed = $false
            credential_present = $false
            credential_source = $null
            nexum_responses_http = $null
            nexum_chat_http = $null
            direct_responses_verified = $false
            chat_completions_verified = $false
            mode = 'unresolved'
            config_changed = $false
            user_env_persisted = $false
            local_backup_created = $false
            restart_required = $false
            blocker = $null
          }

          function Save-Evidence {
            $e | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $evidencePath -Encoding utf8
          }

          function Invoke-NexumProbe([string]$Path, [hashtable]$Payload, [string]$Key) {
            $headers = @{ Authorization = "Bearer $Key" }
            try {
              $resp = Invoke-WebRequest -UseBasicParsing -Uri ("https://dialagram.me/router/v1/" + $Path) -Method Post -Headers $headers -ContentType 'application/json' -Body ($Payload | ConvertTo-Json -Depth 12 -Compress) -TimeoutSec 45
              return [ordered]@{ status = [int]$resp.StatusCode; ok = ([int]$resp.StatusCode -ge 200 -and [int]$resp.StatusCode -lt 300) }
            } catch {
              $status = $null
              try { $status = [int]$_.Exception.Response.StatusCode } catch {}
              return [ordered]@{ status = $status; ok = $false }
            }
          }

          try {
            $profiles = @(Get-CimInstance Win32_UserProfile | Where-Object {
              -not $_.Special -and $_.Loaded -and $_.LocalPath -like 'C:\Users\*'
            })
            $target = $profiles | Where-Object { Test-Path -LiteralPath (Join-Path $_.LocalPath '.codex') } | Select-Object -First 1
            if (-not $target) {
              $target = $profiles | Where-Object { Test-Path -LiteralPath (Join-Path $_.LocalPath 'AppData\Local') } | Select-Object -First 1
            }
            if (-not $target) { throw 'No loaded interactive Windows user profile found' }

            $profile = $target.LocalPath
            $sid = $target.SID
            $e.target_profile_detected = $true

            $codexHome = Join-Path $profile '.codex'
            $codexConfig = Join-Path $codexHome 'config.toml'
            $e.codex_config_existed = Test-Path -LiteralPath $codexConfig
            New-Item -ItemType Directory -Force -Path $codexHome | Out-Null

            $key = $null
            $source = $null
            foreach ($name in @('NEXUM_API_KEY','DIALAGRAM_API_KEY','NEXUM_ROUTER_API_KEY')) {
              $v = [Environment]::GetEnvironmentVariable($name, 'Process')
              if ($v) { $key = $v; $source = "runner_process:$name"; break }
            }

            $userEnvPath = "Registry::HKEY_USERS\$sid\Environment"
            if (-not $key -and (Test-Path -LiteralPath $userEnvPath)) {
              $userEnv = Get-ItemProperty -LiteralPath $userEnvPath
              foreach ($name in @('NEXUM_API_KEY','DIALAGRAM_API_KEY','NEXUM_ROUTER_API_KEY')) {
                $v = $userEnv.$name
                if ($v) { $key = [string]$v; $source = "user_environment:$name"; break }
              }
            }

            if (-not $key) {
              foreach ($settingsPath in @(
                (Join-Path $profile '.claude\settings.json'),
                (Join-Path $profile '.claude\settings.local.json')
              )) {
                if (-not (Test-Path -LiteralPath $settingsPath)) { continue }
                try {
                  $settings = Get-Content -LiteralPath $settingsPath -Raw | ConvertFrom-Json
                  if ($settings.env.NEXUM_API_KEY) {
                    $key = [string]$settings.env.NEXUM_API_KEY
                    $source = 'claude_settings:NEXUM_API_KEY'
                    break
                  }
                  if ($settings.env.DIALAGRAM_API_KEY) {
                    $key = [string]$settings.env.DIALAGRAM_API_KEY
                    $source = 'claude_settings:DIALAGRAM_API_KEY'
                    break
                  }
                  $anthropicBase = [string]$settings.env.ANTHROPIC_BASE_URL
                  if ($anthropicBase -match 'dialagram\.me') {
                    if ($settings.env.ANTHROPIC_AUTH_TOKEN) {
                      $key = [string]$settings.env.ANTHROPIC_AUTH_TOKEN
                      $source = 'claude_settings:ANTHROPIC_AUTH_TOKEN'
                      break
                    }
                    if ($settings.env.ANTHROPIC_API_KEY) {
                      $key = [string]$settings.env.ANTHROPIC_API_KEY
                      $source = 'claude_settings:ANTHROPIC_API_KEY'
                      break
                    }
                  }
                } catch {}
              }
            }

            if (-not $key) {
              $e.blocker = 'nexum_credential_not_found_in_approved_local_sources'
              $e.mode = 'blocked'
              Save-Evidence
              exit 0
            }

            $e.credential_present = $true
            $e.credential_source = $source

            $responsesPayload = @{
              model = 'meta-muse-spark-1.3'
              input = 'Reply with exactly NEXUM_RESPONSES_OK'
              max_output_tokens = 32
            }
            $responsesProbe = Invoke-NexumProbe -Path 'responses' -Payload $responsesPayload -Key $key
            $e.nexum_responses_http = $responsesProbe.status
            $e.direct_responses_verified = [bool]$responsesProbe.ok

            $chatPayload = @{
              model = 'meta-muse-spark-1.3'
              stream = $false
              max_tokens = 32
              messages = @(@{ role = 'user'; content = 'Reply with exactly NEXUM_CHAT_OK' })
            }
            $chatProbe = Invoke-NexumProbe -Path 'chat/completions' -Payload $chatPayload -Key $key
            $e.nexum_chat_http = $chatProbe.status
            $e.chat_completions_verified = [bool]$chatProbe.ok

            if (-not $responsesProbe.ok) {
              $e.mode = $(if ($chatProbe.ok) { 'bridge_required' } else { 'blocked' })
              $e.blocker = $(if ($chatProbe.ok) { 'responses_api_not_verified' } else { 'nexum_api_probe_failed' })
              Save-Evidence
              exit 0
            }

            if (Test-Path -LiteralPath $codexConfig) {
              $backup = "$codexConfig.aftergraph-nexum-backup-" + [DateTime]::UtcNow.ToString('yyyyMMddHHmmss')
              Copy-Item -LiteralPath $codexConfig -Destination $backup -Force
              $e.local_backup_created = $true
              $text = Get-Content -LiteralPath $codexConfig -Raw
            } else {
              $text = ''
            }

            $root = $text
            $rest = ''
            $m = [regex]::Match($text, '(?m)^\s*\[')
            if ($m.Success) {
              $root = $text.Substring(0, $m.Index)
              $rest = $text.Substring($m.Index)
            }

            $rootLines = @($root -split "\r?\n" | Where-Object {
              $_ -notmatch '^\s*model_provider\s*=' -and
              $_ -notmatch '^\s*model\s*=' -and
              $_ -notmatch '^\s*model_reasoning_effort\s*='
            })
            $newRoot = @(
              'model_provider = "nexum"'
              'model = "meta-muse-spark-1.3"'
              'model_reasoning_effort = "high"'
              ''
            ) + $rootLines

            $rest = [regex]::Replace(
              $rest,
              '(?ms)^\[model_providers\.nexum\]\s*.*?(?=^\[|\z)',
              ''
            )
            $providerBlock = @'
[model_providers.nexum]
name = "NEXUMRouter"
base_url = "https://dialagram.me/router/v1"
env_key = "NEXUM_API_KEY"
wire_api = "responses"
supports_websockets = false
'@
            $next = (($newRoot -join [Environment]::NewLine).TrimEnd() + [Environment]::NewLine + [Environment]::NewLine + $rest.Trim() + [Environment]::NewLine + [Environment]::NewLine + $providerBlock.Trim() + [Environment]::NewLine)
            Set-Content -LiteralPath $codexConfig -Value $next -Encoding utf8

            if (Test-Path -LiteralPath $userEnvPath) {
              New-ItemProperty -LiteralPath $userEnvPath -Name 'NEXUM_API_KEY' -Value $key -PropertyType String -Force | Out-Null
              $e.user_env_persisted = $true
            }

            $python = Get-Command python -ErrorAction SilentlyContinue
            if ($python) {
              & $python.Source -c "import tomllib, pathlib; tomllib.loads(pathlib.Path(r'$codexConfig').read_text(encoding='utf-8-sig')); print('TOML_OK')" | Out-Null
              if ($LASTEXITCODE -ne 0) { throw 'Codex config TOML validation failed' }
            }

            $e.mode = 'direct_responses'
            $e.config_changed = $true
            $e.restart_required = $true
          } catch {
            $e.mode = 'blocked'
            $e.blocker = ('bootstrap_exception:' + $_.Exception.GetType().Name)
          } finally {
            Save-Evidence
          }

      - name: Commit sanitized evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath 'ops-evidence-codex-nexum.json')) {
            throw 'Sanitized evidence file missing'
          }
          New-Item -ItemType Directory -Force -Path 'evidence/ops' | Out-Null
          Copy-Item 'ops-evidence-codex-nexum.json' 'evidence/ops/codex-nexum-jonas-lenovo.json' -Force
          git config user.name "Aftergraph Runner"
          git config user.email "runner@aftergraph.local"
          git add evidence/ops/codex-nexum-jonas-lenovo.json
          if (-not (git diff --cached --quiet)) {
            git commit -m "chore(ops): record Codex NEXUM bootstrap evidence"
            git push origin "HEAD:$env:GITHUB_REF_NAME"
          }
