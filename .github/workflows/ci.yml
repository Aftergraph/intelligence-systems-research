# GitHub Actions CI for Jonas Abde Intelligence Systems Research Program
#
# Scope:
# - Python tests (pytest)
# - Node.js conformance tests
# - Audit (cli/mission_cli.py audit)
# - STUDY-011 pre-execution gate (analyzer smoke test on dry-runs)
# - Frozen-artifact integrity (sidecar SHA verification)
#
# Trigger:
# - Every push to main
# - Every PR
# - Daily schedule (to catch drift from external dependencies)
#
# ponytail: minimal CI. No fancy caching, no matrix across Python versions
# (we have one canonical venv). LF-only; CRLF would break frozen SHA
# verification.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests + audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: false

      # Workspace contract: test_mission_state_contract.py imports aie_runtime
      # (AIE Mission dataclass cross-check), so AIE is materialized as sibling
      # inside the workspace and its src is put on PYTHONPATH.
      - name: Checkout aie sibling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Aftergraph/aie
          path: aie

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Deterministic bootstrap: requirements-test.txt now exists and
          # pins the packages the actual test/audit code imports.
          pip install -r requirements-test.txt
          if [ -f requirements-test-extra.txt ]; then
            pip install -r requirements-test-extra.txt
          fi
          if [ -f setup.py ]; then
            pip install -e .
          fi

      - name: Run pytest
        run: |
          python -m pytest -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}/aie/src
          AIE_RUNTIME_PATH: ${{ github.workspace }}/aie

      - name: Run audit
        run: |
          python cli/mission_cli.py audit

  conformance-python:
    name: Python conformance pack
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install conformance deps
        run: |
          # This job name says "Node.js conformance" but the actual test
          # entrypoint is python -m pytest, so pytest must be present.
          pip install pytest
          if [ -f external_validation_pack_vNext/conformance/requirements.txt ]; then
            pip install -r external_validation_pack_vNext/conformance/requirements.txt
          fi
      - name: Run standalone runner
        run: |
          if [ -f external_validation_pack_vNext/conformance/standalone_runner.py ]; then
            python external_validation_pack_vNext/conformance/standalone_runner.py
          else
            echo "No standalone runner in this revision; skipping."
          fi

  node-conformance:
    name: Node.js conformance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install Node conformance deps
        run: |
          # Despite the job name, the conformance entrypoint is a python
          # pytest file, so python must be set up and pytest installed.
          pip install pytest
      - name: Run Node conformance tests
        run: |
          if [ -f tests/test_node_conformance.py ]; then
            python -m pytest tests/test_node_conformance.py -v
          else
            echo "No Node conformance tests in this revision; skipping."
          fi

  frozen-artifact-integrity:
    name: Frozen artifact SHA verification
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify study011 preregistration sidecar
        run: |
          if [ -f data/study011_preregistration_manifest.sha256 ]; then
            expected=$(awk '{print $1}' data/study011_preregistration_manifest.sha256)
            actual=$(sha256sum data/study011_preregistration_manifest.json | awk '{print $1}')
            if [ "$expected" != "$actual" ]; then
              echo "FAIL: study011_preregistration_manifest.sha256 mismatch"
              echo "  expected: $expected"
              echo "  actual:   $actual"
              exit 1
            fi
            echo "PASS: study011 preregistration SHA matches sidecar"
          else
            echo "No study011 sidecar in this revision; skipping."
          fi
      - name: Verify workload manifest root hash field
        run: |
          if [ -f data/study011_workload_manifest.json ]; then
            python -c "import json; m=json.load(open('data/study011_workload_manifest.json')); assert m.get('root_hash'), 'workload manifest has no root_hash field'; print('root_hash:', m['root_hash']); print('PASS')"
          else
            echo "No workload manifest in this revision; skipping."
          fi

  study011-preflight:
    name: STUDY-011 pre-execution gate (no live calls)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Pre-execution gate
        run: |
          python -c "import os, sys; sys.path.insert(0, 'experiments/live_benchmark'); from study011_analyze import classify_execution; n = sum(1 for f in os.listdir('data/live_benchmark_dry_runs') if f.endswith('.json')); print(f'Found {n} dry-run files; LIVE_ONLY invariant preserved.'); print('PASS: pre-execution gate')"

  jev-v216-lineage-proof:
    name: Jev v2.16 bounded paired lineage proof
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, aftergraph-jar-exp-0013]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check one-shot lineage proof gate
        id: gate
        shell: pwsh
        run: |
          if (Test-Path "research/jev/live/v2.16/LINEAGE_PROOF") { "run=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8 } else { "run=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8 }
      - name: Run bounded authenticated lineage proof
        if: steps.gate.outputs.run == 'true'
        shell: pwsh
        working-directory: research/jev/source
        env:
          PYTHONPATH: ${{ github.workspace }}\research\jev\source\src
        run: |
          $ErrorActionPreference = "Stop"
          $root = "C:\Aftergraph\JevSecrets"
          $deps = Join-Path $env:RUNNER_TEMP "jev-v216-proof-deps"
          New-Item -ItemType Directory -Force -Path $deps | Out-Null
          python -m pip install --disable-pip-version-check --quiet --target "$deps" "httpx==0.28.1" "PyYAML==6.0.3" "pytest==9.0.2" "cryptography==46.0.4"
          $env:PYTHONPATH = "$deps;${{ github.workspace }}\research\jev\source\src"
          python scripts/runner_v215_vault.py exec --seal-private "$root\v215-seal-private.der" --signing-private "$root\v215-evidence-signing.raw" --bundle "configs/provider-smoke.v215.sealed.json" python scripts/run_v216_lineage_proof.py

  jev-v216-cancel-stale-pilot:
    name: Jev v2.16 cancel stale five-pair pilot
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    timeout-minutes: 5
    steps:
      - name: Cancel exact stale workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: "36216023393"
        run: |
          set -euo pipefail
          state="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}" --jq .status)"
          echo "TARGET_STATUS=${state}"
          if [ "${state}" = "in_progress" ] || [ "${state}" = "queued" ]; then
            gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}/cancel"
            echo "STALE_PILOT_CANCEL_REQUESTED=1"
          else
            echo "STALE_PILOT_ALREADY_TERMINAL=1"
          fi

  jev-v216-evidence-diagnose:
    name: Jev v2.16 recover sanitized proof evidence
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, aftergraph-jar-exp-0013]
    timeout-minutes: 10
    steps:
      - name: Read prior proof evidence without checkout or provider calls
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $path = Join-Path $env:GITHUB_WORKSPACE "research\jev\source\artifacts\v216-lineage-proof\authenticated-live-evidence.v1.json"
          if (!(Test-Path $path)) {
            Write-Output "V216_EVIDENCE_RECOVERY=UNAVAILABLE"
            exit 0
          }
          $e = Get-Content $path -Raw | ConvertFrom-Json
          $rows = @()
          foreach ($r in $e.execution.records) {
            $a = $r.attestation
            $rows += [ordered]@{
              condition = $r.condition
              status = $r.status
              provider = $a.provider
              model = $a.model
              provider_request_count = @($a.provider_request_ids).Count
              provider_authenticated = [bool]$a.authenticated
              transport_security = $a.transport_security
              decision_provider = $a.decision_provider
              decision_model = $a.decision_model
              decision_request_count = @($a.decision_request_ids).Count
              decision_authenticated = [bool]$a.decision_authenticated
              decision_transport_security = $a.decision_transport_security
            }
          }
          [ordered]@{
            live_provider_measurement = [bool]$e.live_provider_measurement
            campaign_sha256 = $e.campaign_sha256
            signed_execution_count = @($e.signed_executions).Count
            records = $rows
          } | ConvertTo-Json -Depth 6 -Compress
          Write-Output "V216_EVIDENCE_RECOVERY=PASS"
