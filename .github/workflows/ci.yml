# GitHub Actions CI for Jonas Abde Intelligence Systems Research Program
#
# Scope:
# - Python tests (pytest)
# - Node.js conformance tests
# - Audit (cli/mission_cli.py audit)
# - STUDY-011 pre-execution gate (analyzer smoke test on dry-runs)
# - Frozen-artifact integrity (sidecar SHA verification)
#
# Trigger:
# - Every push to main
# - Every PR
# - Daily schedule (to catch drift from external dependencies)
#
# ponytail: minimal CI. No fancy caching, no matrix across Python versions
# (we have one canonical venv). LF-only; CRLF would break frozen SHA
# verification.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests + audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: false

      # Workspace contract: test_mission_state_contract.py imports aie_runtime
      # (AIE Mission dataclass cross-check), so AIE is materialized as sibling
      # inside the workspace and its src is put on PYTHONPATH.
      - name: Checkout aie sibling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Aftergraph/aie
          path: aie

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Deterministic bootstrap: requirements-test.txt now exists and
          # pins the packages the actual test/audit code imports.
          pip install -r requirements-test.txt
          if [ -f requirements-test-extra.txt ]; then
            pip install -r requirements-test-extra.txt
          fi
          if [ -f setup.py ]; then
            pip install -e .
          fi

      - name: Run pytest
        run: |
          python -m pytest -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}/aie/src
          AIE_RUNTIME_PATH: ${{ github.workspace }}/aie

      - name: Run audit
        run: |
          python cli/mission_cli.py audit

  conformance-python:
    name: Python conformance pack
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install conformance deps
        run: |
          # This job name says "Node.js conformance" but the actual test
          # entrypoint is python -m pytest, so pytest must be present.
          pip install pytest
          if [ -f external_validation_pack_vNext/conformance/requirements.txt ]; then
            pip install -r external_validation_pack_vNext/conformance/requirements.txt
          fi
      - name: Run standalone runner
        run: |
          if [ -f external_validation_pack_vNext/conformance/standalone_runner.py ]; then
            python external_validation_pack_vNext/conformance/standalone_runner.py
          else
            echo "No standalone runner in this revision; skipping."
          fi

  node-conformance:
    name: Node.js conformance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install Node conformance deps
        run: |
          # Despite the job name, the conformance entrypoint is a python
          # pytest file, so python must be set up and pytest installed.
          pip install pytest
      - name: Run Node conformance tests
        run: |
          if [ -f tests/test_node_conformance.py ]; then
            python -m pytest tests/test_node_conformance.py -v
          else
            echo "No Node conformance tests in this revision; skipping."
          fi

  frozen-artifact-integrity:
    name: Frozen artifact SHA verification
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify study011 preregistration sidecar
        run: |
          if [ -f data/study011_preregistration_manifest.sha256 ]; then
            expected=$(awk '{print $1}' data/study011_preregistration_manifest.sha256)
            actual=$(sha256sum data/study011_preregistration_manifest.json | awk '{print $1}')
            if [ "$expected" != "$actual" ]; then
              echo "FAIL: study011_preregistration_manifest.sha256 mismatch"
              echo "  expected: $expected"
              echo "  actual:   $actual"
              exit 1
            fi
            echo "PASS: study011 preregistration SHA matches sidecar"
          else
            echo "No study011 sidecar in this revision; skipping."
          fi
      - name: Verify workload manifest root hash field
        run: |
          if [ -f data/study011_workload_manifest.json ]; then
            python -c "import json; m=json.load(open('data/study011_workload_manifest.json')); assert m.get('root_hash'), 'workload manifest has no root_hash field'; print('root_hash:', m['root_hash']); print('PASS')"
          else
            echo "No workload manifest in this revision; skipping."
          fi

  study011-preflight:
    name: STUDY-011 pre-execution gate (no live calls)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Pre-execution gate
        run: |
          python -c "import os, sys; sys.path.insert(0, 'experiments/live_benchmark'); from study011_analyze import classify_execution; n = sum(1 for f in os.listdir('data/live_benchmark_dry_runs') if f.endswith('.json')); print(f'Found {n} dry-run files; LIVE_ONLY invariant preserved.'); print('PASS: pre-execution gate')"

  jev-provider-preflight:
    name: Jev provider preflight (no live calls)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, aftergraph-jar-exp-0013]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Canonical source gates
        shell: pwsh
        working-directory: research/jev/source
        run: |
          $ErrorActionPreference = "Stop"
          python scripts/verify_no_secrets.py .
          python scripts/verify_release_relocatable.py .
          python -m compileall -q src
      - name: Sealed credential + benchmark preflight
        shell: pwsh
        working-directory: research/jev/source
        env:
          PYTHONPATH: ${{ github.workspace }}\research\jev\source\src
        run: |
          $ErrorActionPreference = "Stop"
          $root = "C:\Aftergraph\JevSecrets"
          if (!(Test-Path "$root\v215-seal-private.der")) { throw "runner seal private key missing" }
          if (!(Test-Path "$root\v215-evidence-signing.raw")) { throw "runner evidence signing key missing" }
          if (!(Test-Path "configs/provider-smoke.v215.sealed.json")) { throw "sealed provider bundle missing" }
          if (!(Test-Path "benchmarks/hermes_qwen_control_plane_ablation.yaml")) { throw "benchmark manifest missing" }
          python scripts/runner_v215_vault.py exec --seal-private "$root\v215-seal-private.der" --signing-private "$root\v215-evidence-signing.raw" --bundle "configs/provider-smoke.v215.sealed.json" python -c "import os; names=('DIALAGRAM_API_KEY','TYPESAFE_API_KEY','JEV_EVIDENCE_SIGNING_KEY_B64'); assert all(os.environ.get(n) for n in names)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output "JEV_PROVIDER_PREFLIGHT=READY_SEALED"

  jev-v215-vault-bootstrap:
    name: Jev v2.15 runner vault bootstrap
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, aftergraph-jar-exp-0013]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Bootstrap persistent runner seal + evidence keys
        shell: pwsh
        working-directory: research/jev/source
        env:
          PYTHONPATH: ${{ github.workspace }}\research\jev\source\src
        run: |
          $ErrorActionPreference = "Stop"
          $root = "C:\Aftergraph\JevSecrets"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          python scripts/runner_v215_vault.py bootstrap --seal-private "$root\v215-seal-private.der" --signing-private "$root\v215-evidence-signing.raw" --signing-key-id "jev-v215-runner"
          icacls $root /inheritance:r /grant:r "${env:USERNAME}:(OI)(CI)F" "SYSTEM:(OI)(CI)F" | Out-Null

  jev-v215-live-smoke:
    name: Jev v2.15 authenticated provider smoke
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, aftergraph-jar-exp-0013]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check one-shot gate
        id: gate
        shell: pwsh
        run: |
          if (Test-Path "research/jev/live/v2.15/RUN") { "run=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8 } else { "run=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8 }
      - name: Authenticated TypeSafe + Dialagram smoke
        if: steps.gate.outputs.run == 'true'
        shell: pwsh
        working-directory: research/jev/source
        env:
          PYTHONPATH: ${{ github.workspace }}\research\jev\source\src
        run: |
          $ErrorActionPreference = "Stop"
          $root = "C:\Aftergraph\JevSecrets"
          $evidence = Join-Path $env:RUNNER_TEMP "v215-live-smoke-evidence.json"
          python scripts/runner_v215_vault.py smoke --seal-private "$root\v215-seal-private.der" --signing-private "$root\v215-evidence-signing.raw" --signing-key-id "jev-v215-runner" --bundle "configs/provider-smoke.v215.sealed.json" --evidence-out "$evidence"
          Write-Output "V215_LIVE_SMOKE_EVIDENCE_BEGIN"
          Get-Content $evidence
          Write-Output "V215_LIVE_SMOKE_EVIDENCE_END"

  jev-v216-typesafe-lineage-probe:
    name: Jev v2.16 TypeSafe lineage probe
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, aftergraph-jar-exp-0013]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check one-shot lineage gate
        id: gate
        shell: pwsh
        run: |
          if (Test-Path "research/jev/live/v2.16/LINEAGE_PROBE") { "run=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8 } else { "run=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8 }
      - name: Inventory TypeSafe trace-like response headers
        if: steps.gate.outputs.run == 'true'
        shell: pwsh
        working-directory: research/jev/source
        env:
          PYTHONPATH: ${{ github.workspace }}\research\jev\source\src
        run: |
          $ErrorActionPreference = "Stop"
          $root = "C:\Aftergraph\JevSecrets"
          python scripts/runner_v215_vault.py exec --seal-private "$root\v215-seal-private.der" --signing-private "$root\v215-evidence-signing.raw" --bundle "configs/provider-smoke.v215.sealed.json" python -c "import json,os,urllib.request,hashlib; body=json.dumps({'model':'jev-latest','state':{'probe':'lineage'},'questions':{'probe':{'type':'noul','instructions':'Return a probability for this harmless transport-lineage probe.'}}}).encode(); req=urllib.request.Request('https://api.typesafe.ai/v1/systemone',data=body,method='POST',headers={'Authorization':'Bearer '+os.environ['TYPESAFE_API_KEY'],'Content-Type':'application/json','User-Agent':'aftergraph-jev-engineering/v2.16'}); resp=urllib.request.urlopen(req,timeout=30); names=sorted(resp.headers.keys()); trace=[n for n in names if any(k in n.lower() for k in ('request','trace','correlation','ray'))]; print(json.dumps({'status':resp.status,'header_names':names,'trace_like_header_names':trace}))"

  jev-v216-paired-pilot:
    name: Jev v2.16 authenticated paired pilot
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, aftergraph-jar-exp-0013]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check one-shot pilot gate
        id: gate
        shell: pwsh
        run: |
          if (Test-Path "research/jev/live/v2.16/PILOT") { "run=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8 } else { "run=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8 }
      - name: Run five-pair authenticated pilot
        if: steps.gate.outputs.run == 'true'
        shell: pwsh
        working-directory: research/jev/source
        env:
          PYTHONPATH: ${{ github.workspace }}\research\jev\source\src
        run: |
          $ErrorActionPreference = "Stop"
          $root = "C:\Aftergraph\JevSecrets"
          $deps = Join-Path $env:RUNNER_TEMP "jev-v216-deps"
          New-Item -ItemType Directory -Force -Path $deps | Out-Null
          python -m pip install --disable-pip-version-check --quiet --target "$deps" "httpx==0.28.1" "PyYAML==6.0.3" "pytest==9.0.2" "cryptography==46.0.4"
          $env:PYTHONPATH = "$deps;${{ github.workspace }}\research\jev\source\src"
          python scripts/runner_v215_vault.py exec --seal-private "$root\v215-seal-private.der" --signing-private "$root\v215-evidence-signing.raw" --bundle "configs/provider-smoke.v215.sealed.json" python scripts/run_v216_pilot.py

  jev-v216-linux-probe:
    name: Jev v2.16 Linux runner probe
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, aie-interop]
    timeout-minutes: 5
    steps:
      - name: Probe AIE interop runner
        shell: bash
        run: |
          set -euo pipefail
          echo "JEV_V216_LINUX_PROBE=PASS"
          uname -a
          python3 --version

  jev-v216-lineage-proof:
    name: Jev v2.16 bounded paired lineage proof
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, aftergraph-jar-exp-0013]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check one-shot lineage proof gate
        id: gate
        shell: pwsh
        run: |
          if (Test-Path "research/jev/live/v2.16/LINEAGE_PROOF") { "run=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8 } else { "run=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8 }
      - name: Run bounded authenticated lineage proof
        if: steps.gate.outputs.run == 'true'
        shell: pwsh
        working-directory: research/jev/source
        env:
          PYTHONPATH: ${{ github.workspace }}\research\jev\source\src
        run: |
          $ErrorActionPreference = "Stop"
          $root = "C:\Aftergraph\JevSecrets"
          $deps = Join-Path $env:RUNNER_TEMP "jev-v216-proof-deps"
          New-Item -ItemType Directory -Force -Path $deps | Out-Null
          python -m pip install --disable-pip-version-check --quiet --target "$deps" "httpx==0.28.1" "PyYAML==6.0.3" "pytest==9.0.2" "cryptography==46.0.4"
          $env:PYTHONPATH = "$deps;${{ github.workspace }}\research\jev\source\src"
          python scripts/runner_v215_vault.py exec --seal-private "$root\v215-seal-private.der" --signing-private "$root\v215-evidence-signing.raw" --bundle "configs/provider-smoke.v215.sealed.json" python scripts/run_v216_lineage_proof.py
