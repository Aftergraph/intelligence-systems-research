# GitHub Actions CI for Jonas Abde Intelligence Systems Research Program
#
# Scope:
# - Python tests (pytest)
# - Node.js conformance tests
# - Audit (cli/mission_cli.py audit)
# - STUDY-011 pre-execution gate (analyzer smoke test on dry-runs)
# - Frozen-artifact integrity (sidecar SHA verification)
#
# Trigger:
# - Every push to main
# - Every PR
# - Daily schedule (to catch drift from external dependencies)
#
# ponytail: minimal CI. No fancy caching, no matrix across Python versions
# (we have one canonical venv). LF-only; CRLF would break frozen SHA
# verification.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests + audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-test.txt ]; then
            pip install -r requirements-test.txt
          fi
          if [ -f setup.py ]; then
            pip install -e .
          fi

      - name: Run pytest
        run: |
          python -m pytest -v --tb=short

      - name: Run audit
        run: |
          python cli/mission_cli.py audit

  conformance-python:
    name: Python conformance pack
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install conformance deps
        run: |
          if [ -f external_validation_pack_vNext/conformance/requirements.txt ]; then
            pip install -r external_validation_pack_vNext/conformance/requirements.txt
          fi
      - name: Run standalone runner
        run: |
          if [ -f external_validation_pack_vNext/conformance/standalone_runner.py ]; then
            python external_validation_pack_vNext/conformance/standalone_runner.py
          else
            echo "No standalone runner in this revision; skipping."
          fi

  node-conformance:
    name: Node.js conformance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run Node conformance tests
        run: |
          if [ -f tests/test_node_conformance.py ]; then
            python -m pytest tests/test_node_conformance.py -v
          else
            echo "No Node conformance tests in this revision; skipping."
          fi

  frozen-artifact-integrity:
    name: Frozen artifact SHA verification
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify study011 preregistration sidecar
        run: |
          if [ -f data/study011_preregistration_manifest.sha256 ]; then
            expected=$(awk '{print $1}' data/study011_preregistration_manifest.sha256)
            actual=$(sha256sum data/study011_preregistration_manifest.json | awk '{print $1}')
            if [ "$expected" != "$actual" ]; then
              echo "FAIL: study011_preregistration_manifest.sha256 mismatch"
              echo "  expected: $expected"
              echo "  actual:   $actual"
              exit 1
            fi
            echo "PASS: study011 preregistration SHA matches sidecar"
          else
            echo "No study011 sidecar in this revision; skipping."
          fi
      - name: Verify workload manifest root hash field
        run: |
          if [ -f data/study011_workload_manifest.json ]; then
            python -c "import json; m=json.load(open('data/study011_workload_manifest.json')); assert m.get('root_hash'), 'workload manifest has no root_hash field'; print('root_hash:', m['root_hash']); print('PASS')"
          else
            echo "No workload manifest in this revision; skipping."
          fi

  study011-preflight:
    name: STUDY-011 pre-execution gate (no live calls)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pre-execution gate
        run: |
          python -c "import os, sys; sys.path.insert(0, 'experiments/live_benchmark'); from study011_analyze import classify_execution; n = sum(1 for f in os.listdir('data/live_benchmark_dry_runs') if f.endswith('.json')); print(f'Found {n} dry-run files; LIVE_ONLY invariant preserved.'); print('PASS: pre-execution gate')"
