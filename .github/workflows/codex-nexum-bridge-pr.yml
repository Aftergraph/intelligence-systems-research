name: Aftergraph Codex NEXUM bridge PR execution

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/codex-nexum-bridge-pr.yml

permissions:
  contents: read

concurrency:
  group: codex-nexum-bridge-v2
  cancel-in-progress: false

jobs:
  install:
    runs-on: [self-hosted, Windows, X64, aftergraph-jar-exp-0013]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Install pinned NEXUM bridge for Codex Desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidencePath = Join-Path $env:GITHUB_WORKSPACE 'codex-nexum-bridge-evidence.json'
          $e = [ordered]@{
            schema = 'aftergraph.codex-nexum-bridge.evidence.v1'
            timestamp_utc = [DateTime]::UtcNow.ToString('o')
            node = $env:COMPUTERNAME
            runner = $env:RUNNER_NAME
            source_repo = 'MakFly/codex-proxy'
            source_sha = 'dac2f3ecf48243f425ea2db0619834e33a7d76b5'
            profile_detected = $false
            bun_detected = $false
            source_pin_verified = $false
            proxy_tests_passed = $false
            config_written = $false
            codex_wired = $false
            proxy_started = $false
            proxy_health_ok = $false
            model_catalog_ok = $false
            credential_present = $false
            live_nexum_request_ok = $false
            startup_registered = $false
            mode = 'blocked'
            restart_required = $false
            blocker = $null
          }
          function Save-Evidence {
            $e | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $evidencePath -Encoding utf8
          }
          try {
            $profiles = @(Get-CimInstance Win32_UserProfile | Where-Object {
              -not $_.Special -and $_.Loaded -and $_.LocalPath -like 'C:\Users\*'
            })
            $target = $profiles | Where-Object {
              Test-Path -LiteralPath (Join-Path $_.LocalPath '.codex')
            } | Select-Object -First 1
            if (-not $target) {
              $target = $profiles | Select-Object -First 1
            }
            if (-not $target) { throw 'interactive_profile_not_found' }
            $profile = $target.LocalPath
            $sid = $target.SID
            $e.profile_detected = $true

            $bunCandidates = @(
              (Join-Path $profile '.bun\bin\bun.exe'),
              'C:\Program Files\Bun\bun.exe'
            )
            $bun = $bunCandidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
            if (-not $bun) {
              $cmd = Get-Command bun -ErrorAction SilentlyContinue
              if ($cmd) { $bun = $cmd.Source }
            }
            if (-not $bun) {
              $e.blocker = 'bun_not_found'
              Save-Evidence
              exit 0
            }
            $e.bun_detected = $true

            $root = 'C:\Aftergraph\CodexNexum'
            $src = Join-Path $root 'codex-proxy'
            New-Item -ItemType Directory -Force -Path $root | Out-Null
            if (-not (Test-Path -LiteralPath (Join-Path $src '.git'))) {
              git clone --filter=blob:none https://github.com/MakFly/codex-proxy.git $src
              if ($LASTEXITCODE -ne 0) { throw 'proxy_clone_failed' }
            }
            Push-Location $src
            try {
              git fetch origin dac2f3ecf48243f425ea2db0619834e33a7d76b5 --depth=1
              if ($LASTEXITCODE -ne 0) { throw 'proxy_fetch_failed' }
              git checkout --detach dac2f3ecf48243f425ea2db0619834e33a7d76b5
              if ($LASTEXITCODE -ne 0) { throw 'proxy_checkout_failed' }
              $head = (git rev-parse HEAD).Trim()
              if ($head -ne 'dac2f3ecf48243f425ea2db0619834e33a7d76b5') {
                throw 'proxy_pin_mismatch'
              }
              $e.source_pin_verified = $true
              & $bun test
              if ($LASTEXITCODE -ne 0) { throw 'proxy_tests_failed' }
              $e.proxy_tests_passed = $true
            } finally {
              Pop-Location
            }

            $proxyHome = Join-Path $profile '.codex-proxy'
            $codexHome = Join-Path $profile '.codex'
            $proxyConfig = Join-Path $proxyHome 'config.json'
            New-Item -ItemType Directory -Force -Path $proxyHome | Out-Null
            New-Item -ItemType Directory -Force -Path $codexHome | Out-Null

            $models = @(
              @{ id='nexum-router'; displayName='NEXUM Router'; reasoning=$true },
              @{ id='meta-muse-spark-1.3'; displayName='Meta Muse Spark 1.3'; reasoning=$true },
              @{ id='meta-muse-spark-1.2'; displayName='Meta Muse Spark 1.2'; reasoning=$true },
              @{ id='xiaomi-mimo-2.5'; displayName='Xiaomi Mimo 2.5' },
              @{ id='qwen-3.5-plus'; displayName='Qwen 3.5 Plus' },
              @{ id='qwen-3.5-plus-thinking'; displayName='Qwen 3.5 Plus Thinking'; reasoning=$true },
              @{ id='qwen-3.6-plus'; displayName='Qwen 3.6 Plus' },
              @{ id='qwen-3.6-plus-thinking'; displayName='Qwen 3.6 Plus Thinking'; reasoning=$true },
              @{ id='qwen-3.7-plus'; displayName='Qwen 3.7 Plus' },
              @{ id='qwen-3.7-plus-thinking'; displayName='Qwen 3.7 Plus Thinking'; reasoning=$true },
              @{ id='qwen-3.6-max-preview'; displayName='Qwen 3.6 Max Preview' },
              @{ id='qwen-3.6-max-preview-thinking'; displayName='Qwen 3.6 Max Preview Thinking'; reasoning=$true },
              @{ id='qwen-3.7-max'; displayName='Qwen 3.7 Max' },
              @{ id='qwen-3.7-max-thinking'; displayName='Qwen 3.7 Max Thinking'; reasoning=$true },
              @{ id='qwen-3.8-max'; displayName='Qwen 3.8 Max' },
              @{ id='qwen-3.8-max-thinking'; displayName='Qwen 3.8 Max Thinking'; reasoning=$true },
              @{ id='qwen-3.8-omni-flash'; displayName='Qwen 3.8 Omni Flash' },
              @{ id='qwen-3.8-omni-flash-thinking'; displayName='Qwen 3.8 Omni Flash Thinking'; reasoning=$true },
              @{ id='qwen-3.5-omni-plus'; displayName='Qwen 3.5 Omni Plus' }
            )
            $cfg = [ordered]@{
              listen = '127.0.0.1:18789'
              defaultProvider = 'nexum'
              defaultModel = 'nexum/meta-muse-spark-1.3'
              providers = [ordered]@{
                nexum = [ordered]@{
                  adapter = 'openai-chat'
                  baseUrl = 'https://dialagram.me/router/v1'
                  apiKey = '${NEXUM_API_KEY}'
                  models = $models
                }
              }
            }
            $cfg | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $proxyConfig -Encoding utf8
            $e.config_written = $true

            $userEnvPath = "Registry::HKEY_USERS\$sid\Environment"
            if (Test-Path -LiteralPath $userEnvPath) {
              $userEnv = Get-ItemProperty -LiteralPath $userEnvPath -Name 'NEXUM_API_KEY' -ErrorAction SilentlyContinue
              if ($userEnv -and $userEnv.NEXUM_API_KEY) {
                $env:NEXUM_API_KEY = [string]$userEnv.NEXUM_API_KEY
                $e.credential_present = $true
              }
            }
            if (-not $e.credential_present -and $env:NEXUM_API_KEY) {
              $e.credential_present = $true
            }

            Push-Location $src
            try {
              & $bun run src/cli.ts wire --config $proxyConfig --codex-home $codexHome
              if ($LASTEXITCODE -ne 0) { throw 'codex_wire_failed' }
              $e.codex_wired = $true
            } finally {
              Pop-Location
            }

            $runKey = "Registry::HKEY_USERS\$sid\Software\Microsoft\Windows\CurrentVersion\Run"
            New-Item -Path $runKey -Force | Out-Null
            $startup = ('"{0}" run "{1}" serve --config "{2}" --codex-home "{3}"' -f $bun, (Join-Path $src 'src\cli.ts'), $proxyConfig, $codexHome)
            New-ItemProperty -LiteralPath $runKey -Name 'AftergraphCodexNexumBridge' -Value $startup -PropertyType String -Force | Out-Null
            $e.startup_registered = $true

            $health = $null
            try {
              $health = Invoke-RestMethod -Uri 'http://127.0.0.1:18789/healthz' -TimeoutSec 2
            } catch {}
            if (-not $health) {
              Remove-Item Env:RUNNER_TRACKING_ID -ErrorAction SilentlyContinue
              $args = @('run', (Join-Path $src 'src\cli.ts'), 'serve', '--config', $proxyConfig, '--codex-home', $codexHome)
              Start-Process -FilePath $bun -ArgumentList $args -WorkingDirectory $src -WindowStyle Hidden
              $e.proxy_started = $true
              Start-Sleep -Seconds 2
            } else {
              $e.proxy_started = $true
            }
            $health = Invoke-RestMethod -Uri 'http://127.0.0.1:18789/healthz' -TimeoutSec 5
            if ($health.status -ne 'ok') { throw 'proxy_health_failed' }
            $e.proxy_health_ok = $true

            $catalog = Invoke-RestMethod -Uri 'http://127.0.0.1:18789/v1/models' -TimeoutSec 5
            if (-not ($catalog.data | Where-Object { $_.id -eq 'nexum/meta-muse-spark-1.3' })) {
              throw 'model_catalog_missing_default'
            }
            $e.model_catalog_ok = $true

            if ($e.credential_present) {
              $body = @{
                model = 'nexum/meta-muse-spark-1.3'
                input = 'Reply with exactly AFTERGRAPH_NEXUM_OK'
                stream = $false
                max_output_tokens = 32
              } | ConvertTo-Json -Depth 8 -Compress
              try {
                $resp = Invoke-RestMethod -Uri 'http://127.0.0.1:18789/v1/responses' -Method Post -ContentType 'application/json' -Body $body -TimeoutSec 60
                if ($resp.status -eq 'completed' -or $resp.output) {
                  $e.live_nexum_request_ok = $true
                }
              } catch {
                $e.blocker = 'live_nexum_request_failed'
              }
            }

            $e.restart_required = $true
            if ($e.live_nexum_request_ok) {
              $e.mode = 'verified_live'
              $e.blocker = $null
            } elseif ($e.credential_present) {
              $e.mode = 'installed_live_probe_failed'
              if (-not $e.blocker) { $e.blocker = 'live_probe_not_verified' }
            } else {
              $e.mode = 'installed_credential_pending'
              $e.blocker = 'NEXUM_API_KEY_not_present_in_user_environment'
            }
          } catch {
            $e.mode = 'blocked'
            $e.blocker = ('bootstrap_exception:' + $_.Exception.Message)
          } finally {
            Save-Evidence
          }

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-nexum-jonas-lenovo
          path: codex-nexum-bridge-evidence.json
          if-no-files-found: error
          retention-days: 7
