name: Bootstrap Lenovo WORKS Native

on:
  push:
    branches:
      - bootstrap/lenovo-works-native
    paths:
      - experiments/runtime_acceleration/bootstrap-trigger-20260921.txt
      - .github/workflows/bootstrap-lenovo-works-native.yml

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Prove physical host
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host ("host=" + [Environment]::MachineName)
          Write-Host ("runner_name=" + $env:RUNNER_NAME)
          Write-Host ("runner_os=" + $env:RUNNER_OS)
          Write-Host ("runner_arch=" + $env:RUNNER_ARCH)
          if ([Environment]::MachineName -ne 'JONAS-LENOVO') { throw "wrong_host" }

      - name: Install canonical Go toolchain
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.0'
          cache: false

      - name: Bootstrap WORKS source and worker binary
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:LOCALAPPDATA 'Aftergraph\WORKS'
          $src = Join-Path $root 'src'
          New-Item -ItemType Directory -Force -Path $root | Out-Null

          $worksSha = '6e3d5b53f30fc7d5dcb1d8e3b3243b1b75b8e3de'
          if (-not (Test-Path (Join-Path $src '.git'))) {
            git clone --no-checkout https://github.com/Aftergraph/works-execution.git $src
          }
          git -C $src fetch --depth 1 origin $worksSha
          git -C $src checkout --force $worksSha

          $releaseApi = 'https://api.github.com/repos/Aftergraph/works-execution/releases/latest'
          $headers = @{ 'User-Agent' = 'Aftergraph-Lenovo-Bootstrap' }
          $release = Invoke-RestMethod -Headers $headers -Uri $releaseApi
          $asset = $release.assets | Where-Object { $_.name -match '(?i)works-worker.*windows.*(amd64|x64).*\.exe$|(?i)works-worker.*\.exe$' } | Select-Object -First 1
          if ($asset) {
            Invoke-WebRequest -Headers $headers -Uri $asset.browser_download_url -OutFile (Join-Path $root 'works-worker.exe')
            Write-Host ("worker_source=release:" + $asset.name)
          } else {
            Write-Host 'worker_source=local_canonical_build'
            $toolGo = Get-ChildItem -Path (Join-Path $env:RUNNER_TOOL_CACHE 'go\1.25.0\x64\bin\go.exe') -ErrorAction Stop | Select-Object -First 1
            $env:GOROOT = Split-Path -Parent (Split-Path -Parent $toolGo.FullName)
            $env:GOPATH = Join-Path $root 'gopath'
            $env:PATH = (Join-Path $env:GOROOT 'bin') + ';' + $env:PATH
            $env:GOTOOLCHAIN = 'local'
            Write-Host ("go_version=" + (& $toolGo.FullName version))
            Push-Location $src
            try {
              go test ./internal/worker -run 'TestRunCommandWindows|TestSanitizedWorkerProcessEnv|TestCommandShellWindows' -count=1
              if ($LASTEXITCODE -ne 0) { throw 'windows_worker_boundary_tests_failed' }
              go build -trimpath -o (Join-Path $root 'works-worker.exe') ./cmd/works-worker
              if ($LASTEXITCODE -ne 0) { throw 'works_worker_build_failed' }
            } finally { Pop-Location }
          }

          $workerExe = Join-Path $root 'works-worker.exe'
          if (-not (Test-Path -LiteralPath $workerExe -PathType Leaf)) { throw 'worker_binary_missing_after_bootstrap' }
          $sha256 = [System.Security.Cryptography.SHA256]::Create()
          try {
            $stream = [System.IO.File]::OpenRead($workerExe)
            try { $workerSha = ([BitConverter]::ToString($sha256.ComputeHash($stream))).Replace('-','').ToLowerInvariant() } finally { $stream.Dispose() }
          } finally { $sha256.Dispose() }
          Write-Host ("works_source_head=" + (git -C $src rev-parse HEAD))
          Write-Host ("worker_sha256=" + $workerSha)
          Write-Host ("worker_binary_present=" + (Test-Path (Join-Path $root 'works-worker.exe')))
          Write-Host ("installer_present=" + (Test-Path (Join-Path $src 'ops\windows\install-works-worker.ps1')))

      - name: Prove Lenovo to canonical WORKS edge
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'https://works.rendetalje.dk'
          try {
            $health = Invoke-WebRequest -UseBasicParsing -Uri ($base + '/healthz') -TimeoutSec 10
            Write-Host ("works_edge_health_http=" + [int]$health.StatusCode)
          } catch {
            $code = if ($_.Exception.Response) { [int]$_.Exception.Response.StatusCode } else { 0 }
            Write-Host ("works_edge_health_http=" + $code)
            if ($code -eq 0) { throw 'works_edge_unreachable' }
          }

          $body = @{ worker_id = 'wrkr_probe_only'; challenge = 'deliberately-wrong-enrollment-challenge' } | ConvertTo-Json -Compress
          try {
            $resp = Invoke-WebRequest -UseBasicParsing -Method Post -Uri ($base + '/v1/workers/enroll') -ContentType 'application/json' -Body $body -TimeoutSec 10
            $enrollCode = [int]$resp.StatusCode
          } catch {
            $enrollCode = if ($_.Exception.Response) { [int]$_.Exception.Response.StatusCode } else { 0 }
          }
          Write-Host ("works_edge_wrong_enrollment_http=" + $enrollCode)
          if ($enrollCode -ne 401) { throw ("works_enrollment_not_fail_closed_http_" + $enrollCode) }

      - name: Discover credential brokers without reading secret values
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          gh auth status 2>&1 | ForEach-Object { Write-Host $_ }
          foreach ($target in @('Aftergraph/intelligence-systems-research','Aftergraph/works-execution','Aftergraph/aie')) {
            Write-Host ("repo_secret_names_target=" + $target)
            $rows = @(& gh secret list --repo $target 2>$null)
            foreach ($row in $rows) {
              $name = ($row -split "\s+")[0]
              if ($name -match 'WORKS|ENROLL') { Write-Host ("secret_name=" + $name) }
            }
          }
          Write-Host 'org_secret_names_target=Aftergraph'
          $orgRows = @(& gh secret list --org Aftergraph 2>$null)
          foreach ($row in $orgRows) {
            $name = ($row -split "\s+")[0]
            if ($name -match 'WORKS|ENROLL') { Write-Host ("secret_name=" + $name) }
          }
          $global:LASTEXITCODE = 0
          exit 0

      - name: Probe optional Lenovo to production VDS SSH path
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $hostName = (& ssh.exe -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=yes root@169.58.199.34 hostname 2>$null | Out-String).Trim()
          if ($LASTEXITCODE -eq 0 -and $hostName -eq 'vmi3517816') {
            Write-Host 'lenovo_to_vds_ssh=verified'
          } else {
            Write-Host 'lenovo_to_vds_ssh=not_authorized_noncanonical'
            Write-Host 'credential_transport=canonical_https_edge_required'
          }
          $global:LASTEXITCODE = 0
          exit 0

      - name: Enqueue verified WORKS fix through protected merge queue
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          gh pr merge 131 --repo Aftergraph/works-execution --auto --squash
          Write-Host 'works_pr_131_merge_queue=requested'

      - name: Discover existing Aftergraph control-plane configuration without exposing values
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:LOCALAPPDATA 'Aftergraph\WORKS'
          $secretFile = Join-Path $root 'worker.secrets.json'
          Write-Host ("secret_file_present=" + (Test-Path $secretFile))
          Write-Host ("env_WORKS_ENROLL_SECRET_present=" + (-not [string]::IsNullOrWhiteSpace($env:WORKS_ENROLL_SECRET)))
          Write-Host ("env_WORKS_API_present=" + (-not [string]::IsNullOrWhiteSpace($env:WORKS_API)))
          Write-Host ("gh_present=" + [bool](Get-Command gh.exe -ErrorAction SilentlyContinue))
          Write-Host ("git_present=" + [bool](Get-Command git.exe -ErrorAction SilentlyContinue))
