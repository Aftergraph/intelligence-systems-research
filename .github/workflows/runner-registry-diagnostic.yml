name: Runner registry diagnostic

on:
  push:
    branches:
      - ops/migration-readonly-probe-20260920
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect repository runner registry
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o runners.json -w '%{http_code}'             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$REPO/actions/runners")"

          echo "runner_registry_http_status=$status"

          if [ "$status" = "200" ]; then
            python - <<'PY'
          import json
          with open("runners.json", "r", encoding="utf-8") as fh:
              payload = json.load(fh)
          safe = {
              "total_count": payload.get("total_count", 0),
              "runners": [
                  {
                      "name": r.get("name"),
                      "os": r.get("os"),
                      "status": r.get("status"),
                      "busy": r.get("busy"),
                      "labels": sorted(
                          [x.get("name") for x in r.get("labels", []) if x.get("name")]
                      ),
                  }
                  for r in payload.get("runners", [])
              ],
          }
          print(json.dumps(safe, sort_keys=True))
          PY
          else
            python - <<'PY'
          import json
          try:
              payload = json.load(open("runners.json", "r", encoding="utf-8"))
          except Exception:
              payload = {}
          print(json.dumps({
              "registry_access": "denied_or_unavailable",
              "message": payload.get("message"),
          }, sort_keys=True))
          PY
          fi
