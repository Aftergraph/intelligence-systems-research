name: Cancel stale Codex bridge run

on:
  push:
    branches:
      - ops/codex-nexum-jonas-lenovo-20260921
    paths:
      - .github/workflows/cancel-stale-codex-bridge-run.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Cancel stale queued bridge run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/${{ github.repository }}/actions/runs/35603205617/cancel
