name: JAR-EXP-0013 controlled host

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jar-exp-0013-controlled-host
  cancel-in-progress: false

jobs:
  controlled-host:
    runs-on: [self-hosted, Windows, X64, aftergraph-jar-exp-0013]
    timeout-minutes: 30
    env:
      JAR_EXP_0013_HOST_CONFIG: ${{ vars.JAR_EXP_0013_HOST_CONFIG }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/jar-exp-0013-runtime-acceleration
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install isolated bridge dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements-test.txt "psutil>=6,<7"

      - name: Run complete JAR-EXP-0013 functional suite
        shell: pwsh
        run: |
          python -m pytest tests/runtime_acceleration -q

      - name: Require machine-local host configuration
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:JAR_EXP_0013_HOST_CONFIG)) {
            throw "Repository variable JAR_EXP_0013_HOST_CONFIG is not configured"
          }
          if (-not (Test-Path -LiteralPath $env:JAR_EXP_0013_HOST_CONFIG)) {
            throw "Controlled-host config does not exist at configured path"
          }

      - name: Probe controlled Windows Hermes host
        shell: pwsh
        run: |
          $outDir = Join-Path $env:RUNNER_TEMP "jar-exp-0013"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          python -m experiments.runtime_acceleration.controlled_host --config "$env:JAR_EXP_0013_HOST_CONFIG" --output (Join-Path $outDir "controlled-host-probe.json")

      - name: Upload non-secret probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jar-exp-0013-controlled-host-probe-${{ github.run_id }}
          path: ${{ runner.temp }}/jar-exp-0013/controlled-host-probe.json
          if-no-files-found: warn
          retention-days: 30
