name: Jev provider preflight

on:
  pull_request:
    paths:
      - "research/jev/**"
      - ".github/workflows/jev-provider-preflight.yml"

permissions:
  contents: read

jobs:
  provider-preflight:
    runs-on: [self-hosted, linux, x64, aftergraph-ci]
    environment: provider-smoke
    timeout-minutes: 20
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      DIALAGRAM_API_KEY: ${{ secrets.DIALAGRAM_API_KEY }}
      JEV_EVIDENCE_SIGNING_KEY_B64: ${{ secrets.JEV_EVIDENCE_SIGNING_KEY_B64 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify canonical source hygiene
        working-directory: research/jev/source
        run: |
          set -euo pipefail
          python3 scripts/verify_no_secrets.py .
          python3 scripts/verify_release_relocatable.py .
          python3 -m compileall -q src
      - name: Provider credential and benchmark preflight
        working-directory: research/jev/source
        env:
          PYTHONPATH: ${{ github.workspace }}/research/jev/source/src
        run: |
          set -euo pipefail
          python3 -m jev_engineering.cli benchmark-preflight benchmarks/hermes_qwen_control_plane_ablation.yaml
