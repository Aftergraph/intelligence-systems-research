name: STUDY-015 Evidence Integrity

on:
  pull_request:
    branches:
      - research/study015-l4-repeatability-evidence-v1
  push:
    branches:
      - research/study015-l5-durable-recovery-evidence-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    name: L3 + L4 + L5 receipt integrity and claim boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Run STUDY-015 evidence-only tests
        run: |
          python -m pip install -q pytest
          python -m pytest -q             tests/test_study015_live_causal_evidence.py             tests/test_study015_l4_repeatability_evidence.py             tests/test_study015_l5_durable_recovery_evidence.py
