name: STUDY-015 Probe Bundle

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-test.txt
      - name: Validate imported exact-head probe artifacts
        run: |
          python -m pytest -q tests/test_study015_probe_fabric.py tests/test_study015_probe_bundle.py
          python -m experiments.study015.probe_bundle > study015-composition-probe.json
          python - <<'PY'
          import json
          p=json.load(open('study015-composition-probe.json', encoding='utf-8'))
          assert p['schema']=='study015.composition-probe/1.0'
          assert p['component_count']==5
          assert len(p['probe_root_sha256'])==64
          assert len(p['artifact_provenance'])==5
          print('STUDY015_PROBE_BUNDLE=PASS')
          print('probe_root_sha256='+p['probe_root_sha256'])
          PY
